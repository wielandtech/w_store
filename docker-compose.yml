services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=w_store.settings
    depends_on:
      - rabbitmq

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"  # AMQP protocol port
      - "15672:15672"  # Management interface port
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  celery:
    build: .
    command: celery -A w_store worker -l info
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=w_store.settings
    depends_on:
      - rabbitmq
      - web

  flower:
    build: .
    command: celery -A w_store flower --port=5555
    ports:
      - "5555:5555"
    environment:
      - DJANGO_SETTINGS_MODULE=w_store.settings
    depends_on:
      - celery
      - rabbitmq

volumes:
  rabbitmq_data: